<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCore Systems - Intake Pasien</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        vetgreen: {
                            50: '#e6f4f0',
                            100: '#c3e4da',
                            700: '#075e47',
                            800: '#044e3a',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #F8FAFC;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1E293B;
        }
        .sidebar-item-active {
            background-color: #ECFDF5;
            color: #065F46;
            font-weight: 700;
        }
        .sidebar-item-inactive {
            color: #475569;
            font-weight: 500;
        }
        .sidebar-item-inactive:hover {
            background-color: #F8FAFC;
            color: #0F172A;
        }
        .input-field {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            color: #1e293b;
            transition: all 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #044e3a;
            box-shadow: 0 0 0 2px rgba(4, 78, 58, 0.1);
        }
        .visit-type-btn {
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            transition: all 0.2s;
        }
        .visit-type-btn.active {
            border-color: #044e3a;
            background-color: #f8fafc;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .visit-type-btn.active .icon-container {
            color: #044e3a;
        }
    </style>
</head>
<body class="min-h-screen flex text-slate-800 antialiased selection:bg-emerald-200 selection:text-emerald-950">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 min-h-screen sticky top-0 h-screen">
        <div class="px-5 pt-5 pb-6 border-b border-slate-100 flex items-center justify-center">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-800 to-slate-900 text-white flex items-center justify-center shadow-xs">
                <i data-lucide="stethoscope" class="w-5 h-5 text-emerald-300"></i>
            </div>
        </div>

        <div class="px-4 pt-6 pb-2">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider ml-2">MENU UTAMA</span>
        </div>

        <!-- Navigation Menu -->
        <nav id="sidebarNav" class="px-3 space-y-1 overflow-y-auto flex-1">
            <a href="index.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sidebar-item-inactive transition-all">
                <i data-lucide="layout-grid" class="w-4 h-4 shrink-0"></i> Overview Utama
            </a>
            <a href="patients.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sidebar-item-active transition-all">
                <i data-lucide="users" class="w-4 h-4 shrink-0"></i> Daftar Pasien
            </a>
            <a href="#" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sidebar-item-inactive transition-all">
                <i data-lucide="bed" class="w-4 h-4 shrink-0"></i> Rawat Inap
            </a>
        </nav>

        <!-- Bottom User Card -->
        <div class="p-4 border-t border-slate-100">
            <div class="flex items-center gap-3 p-2 rounded-xl border border-slate-100">
                <div class="w-8 h-8 rounded-full bg-emerald-800 text-white font-bold text-xs flex items-center justify-center shrink-0 shadow-2xs">
                    SR
                </div>
                <div class="min-w-0 flex-1">
                    <p class="text-xs font-bold text-slate-900 truncate">Siti Rahma</p>
                    <p class="text-[10px] text-slate-500 truncate flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Front Office</p>
                </div>
                <button class="p-1 text-slate-400 hover:text-slate-600 transition-colors shrink-0">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 min-w-0 flex flex-col bg-slate-50 min-h-screen">
        
        <!-- Top Header -->
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
            <h1 class="text-base font-bold text-slate-900">Intake Pasien</h1>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-semibold text-slate-600">
                    <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
                    <span id="headerDate">12 Agustus 2026</span>
                </div>
                <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 transition-colors relative">
                    <i data-lucide="bell" class="w-4 h-4"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full border border-white"></span>
                </button>
            </div>
        </header>

        <!-- Form Content -->
        <div class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-4xl mx-auto space-y-6">
                
                <!-- Patient Info Card -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200 flex items-center gap-5 shadow-sm">
                    <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 shrink-0 border border-slate-200">
                        <i data-lucide="dog" class="w-6 h-6"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-center gap-3">
                            <h2 id="patientName" class="text-xl font-bold text-slate-900">...</h2>
                        </div>
                        <p id="patientMeta" class="text-xs text-slate-500 mt-1 mb-2">...</p>
                        <span id="patientStatus" class="inline-flex items-center px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-wider bg-emerald-100 text-emerald-800">
                            MENUNGGU PEMERIKSAAN
                        </span>
                        <div class="mt-2 text-[11px] font-semibold text-slate-600 flex items-center gap-4">
                            <span>Kode: <span id="patientCode" class="font-bold text-slate-900">-</span></span>
                            <span>Usia: <span id="patientAge" class="font-bold text-slate-900">-</span></span>
                        </div>
                    </div>
                </div>

                <form id="intakeForm" class="space-y-6">
                    <!-- Tipe Kunjungan -->
                    <div class="space-y-3">
                        <h3 class="text-sm font-bold text-slate-900">Tipe Kunjungan</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <button type="button" id="btnReguler" class="visit-type-btn active rounded-xl p-4 flex items-center gap-3 text-left">
                                <div class="icon-container text-slate-400">
                                    <i data-lucide="stethoscope" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <div class="text-xs font-bold text-slate-900">REGULER</div>
                                    <div class="text-[11px] text-slate-500 mt-0.5">Konsultasi biasa</div>
                                </div>
                            </button>
                            <button type="button" id="btnRanap" class="visit-type-btn rounded-xl p-4 flex items-center gap-3 text-left">
                                <div class="icon-container text-slate-400">
                                    <i data-lucide="bed" class="w-5 h-5"></i>
                                </div>
                                <div>
                                    <div class="text-xs font-bold text-slate-900">RANAP</div>
                                    <div class="text-[11px] text-slate-500 mt-0.5">Rawat inap</div>
                                </div>
                            </button>
                        </div>
                        <input type="hidden" id="visitType" value="REGULER">
                    </div>

                    <!-- Vital Signs -->
                    <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                        <h3 class="text-sm font-bold text-slate-900">Vital Signs</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Berat Badan</label>
                                <div class="relative">
                                    <input type="text" id="vitalWeight" placeholder="0.0" class="input-field pr-8">
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-500">kg</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Suhu Tubuh</label>
                                <div class="relative">
                                    <input type="text" id="vitalTemp" placeholder="0.0" class="input-field pr-8">
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-500">°C</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Detak Jantung</label>
                                <div class="relative">
                                    <input type="text" id="vitalHr" placeholder="0" class="input-field pr-10">
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-500">bpm</span>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Pernapasan</label>
                                <div class="relative">
                                    <input type="text" id="vitalResp" placeholder="0" class="input-field pr-10">
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-500">/min</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Keluhan Utama -->
                    <div class="space-y-2">
                        <label class="block text-sm font-bold text-slate-900">Keluhan Utama</label>
                        <textarea id="keluhanUtama" rows="3" placeholder="Deskripsikan keluhan utama pasien..." class="input-field resize-none bg-white py-3 shadow-sm" required></textarea>
                    </div>

                    <!-- Riwayat Terkini -->
                    <div class="space-y-2">
                        <label class="block text-sm font-bold text-slate-900">Riwayat Terkini</label>
                        <textarea id="riwayatTerkini" rows="2" placeholder="Belum ada riwayat kunjungan sebelumnya" class="input-field resize-none bg-white py-3 shadow-sm text-slate-500"></textarea>
                    </div>

                    <!-- Riwayat Obat & Vaksin -->
                    <div class="space-y-2">
                        <label class="block text-sm font-bold text-slate-900">Riwayat Obat & Vaksin</label>
                        <textarea id="riwayatObat" rows="2" placeholder="Belum ada riwayat obat atau vaksin" class="input-field resize-none bg-white py-3 shadow-sm text-slate-500"></textarea>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center justify-end gap-4 pt-4">
                        <a href="patients.html" class="text-xs font-bold text-slate-600 hover:text-slate-900">Batal</a>
                        <button type="submit" id="saveIntakeBtn" class="bg-[#044e3a] hover:bg-[#033b2c] text-white px-5 py-2.5 rounded-lg text-xs font-bold flex items-center gap-2 shadow-sm transition-colors">
                            <i data-lucide="save" class="w-4 h-4"></i>
                            Simpan & Kirim ke Dokter
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toastNotification" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2.5 transform transition-all duration-300 translate-y-20 opacity-0 z-50">
        <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
            <i data-lucide="check" class="w-3.5 h-3.5"></i>
        </div>
        <span id="toastText">Data berhasil disimpan!</span>
    </div>

    <!-- Scripts -->
    <script>
        lucide.createIcons();
        
        // Simple date setter
        const dateOptions = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('headerDate').textContent = new Date().toLocaleDateString('id-ID', dateOptions);

        // Visit type toggle
        const btnReguler = document.getElementById('btnReguler');
        const btnRanap = document.getElementById('btnRanap');
        const visitTypeInput = document.getElementById('visitType');

        btnReguler.addEventListener('click', () => {
            btnReguler.classList.add('active');
            btnRanap.classList.remove('active');
            visitTypeInput.value = 'REGULER';
        });

        btnRanap.addEventListener('click', () => {
            btnRanap.classList.add('active');
            btnReguler.classList.remove('active');
            visitTypeInput.value = 'RANAP';
        });
    </script>
    <script type="module" src="/src/patient_detail.ts"></script>
</body>
</html>
